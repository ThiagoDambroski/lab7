<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7 - Loja</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header, footer {
            background: #ddd;
            padding: 15px;
            text-align: center;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 0;
            list-style: none;

            a {
                color: black;
            }
        }

        main {
            padding: 20px;

            section {
                margin-bottom: 35px;
            }
        }

        #product-div, #produtos-selecionados {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;

            article {
                box-sizing: border-box;
                width: 250px;
                padding: 15px;
                background: white;
                border: 1px solid #ccc;

                img {
                    width: 100%;
                    height: 160px;
                    object-fit: contain;
                }

                p {
                    font-size: 14px;
                }

                button {
                    margin-top: 10px;
                    padding: 8px;
                    cursor: pointer;
                }
            }
        }

        #total {
            font-weight: bold;
        }
    </style>
    <script src="produtos.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Loja</h1>
        <nav>
            <ul>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#cesto">Cesto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="produtos">
            <h2>Produtos</h2>
            <div id="product-div"></div>
        </section>

        <section id="cesto">
            <h2>Cesto de compras</h2>
            <div id="produtos-selecionados"></div>
            <p id="total"></p>
        </section>
    </main>

    <footer>
        <p>2026, ULusófona</p>
    </footer>
</body>
</html>
